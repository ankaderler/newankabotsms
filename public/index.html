<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦅 Anka VIP Medya & SMS Paneli</title>
    <style>
        :root { 
            --bg: #030712; --card: #0b1329; --accent: #2563eb; --blue-glow: #38bdf8; --text: #f0f9ff; --border: #1e3a8a; 
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1050px; margin: 0 auto; }
        header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #0f172a, #1e3a8a); border-radius: 18px; border: 1px solid var(--border); margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { color: var(--blue-glow); margin: 0 0 10px 0; font-size: 2.4rem; }
        p { color: #94a3b8; margin: 0; }
        .iban-box { background: #0f172a; padding: 20px 25px; border-radius: 14px; display: inline-block; margin-top: 22px; border-left: 5px solid var(--blue-glow); text-align: left; border: 1px solid var(--border); }
        .iban-box b { color: var(--blue-glow); }
        .category-title { color: var(--blue-glow); border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-top: 45px; font-size: 1.6rem; font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--card); border-radius: 14px; padding: 22px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { margin-top: 0; color: #ffffff; font-size: 1.2rem; }
        .price { font-size: 1.6rem; color: var(--blue-glow); font-weight: bold; margin: 15px 0; }
        .btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff; border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; display: block; width: 100%; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3,7,18,0.88); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 16px; width: 90%; max-width: 480px; border: 1px solid var(--blue-glow); }
        input { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #030712; border: 1px solid #1e3a8a; color: white; border-radius: 8px; box-sizing: border-box; }
        .payment-info-box { background: #030712; padding: 15px; border-radius: 10px; border: 1px dashed var(--blue-glow); margin-bottom: 15px; font-size: 0.95rem; color: #cbd5e1; }
        .result-box { background: #030712; padding: 15px; border-radius: 10px; border: 1px solid #38bdf8; color: #38bdf8; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🦅 Anka VIP Medya & SMS Paneli</h1>
            <p>Otomatik Sosyal Medya ve Numara Servisleri</p>
            <div class="iban-box">
                <strong>💳 Ödeme Yapılacak Kişisel IBAN Adresi:</strong><br>
                • Alıcı Adı Soyadı: <b>Resul Sakal</b><br>
                • IBAN: <b>TR62 0006 2000 5000 0006 8107 73</b><br>
                • Destek: <a href="https://t.me/SMSPATRONUM" target="_blank" style="color:var(--blue-glow);">@SMSPATRONUM</a>
            </div>
        </header>
        <div id="product-list"></div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: var(--blue-glow); margin-top:0;">Ödeme ve Sipariş Ekranı</h3>
            <div class="payment-info-box" id="modalDetailsText"></div>
            <div id="formSection">
                <label style="font-size:0.9rem; color:#cbd5e1;" id="targetLabel"><b>Hedef Link / Kullanıcı Adı:</b></label>
                <input type="text" id="customerTarget" placeholder="@kullaniciadi veya profil linki" required>
                <label style="font-size:0.9rem; color:#cbd5e1;"><b>Telegram Kullanıcı Adınız:</b></label>
                <input type="text" id="customerContact" placeholder="@telegramadi" required>
                <button type="button" class="btn" id="payButton" onclick="submitPayment()">Ödemeyi Yaptım</button>
            </div>
            <div id="resultSection" style="display:none;"></div>
            <button type="button" onclick="closeModal()" style="background:#1e3a8a; color:#cbd5e1; border:none; padding:10px; width:100%; border-radius:8px; margin-top:15px; cursor:pointer;">Kapat</button>
        </div>
    </div>

    <script>
        let allProducts = [];
        let selectedProductData = null;

        fetch('/api/products').then(res => res.json()).then(data => {
            allProducts = data.products;
            renderProducts();
        });

        function renderProducts() {
            const container = document.getElementById('product-list');
            const categories = [...new Set(allProducts.map(p => p.category))];
            let html = '';
            categories.forEach(cat => {
                let catName = cat === 'SMSOnay' ? '📱 SMS Onay & Numara Servisleri' : '🦅 ' + cat + ' Hizmetleri';
                html += `<div class="category-title">${catName}</div><div class="grid">`;
                allProducts.filter(p => p.category === cat).forEach(p => {
                    let pJson = encodeURIComponent(JSON.stringify(p));
                    html += `
                        <div class="card">
                            <div>
                                <h3>${p.name}</h3>
                                <p style="color:#94a3b8; font-size:0.9rem;">${p.desc}</p>
                            </div>
                            <div>
                                <div class="price">${p.price} TL</div>
                                <button class="btn" onclick="openModal('${pJson}')">Satın Al</button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function openModal(productStr) {
            selectedProductData = JSON.parse(decodeURIComponent(productStr));
            document.getElementById('modalTitle').innerText = selectedProductData.name;
            document.getElementById('modalDetailsText').innerHTML = `
                • Ürün: <b style="color:var(--blue-glow);">${selectedProductData.name}</b><br>
                • Tutar: <b style="color:var(--blue-glow);">${selectedProductData.price} TL</b><br>
                • IBAN: <b>TR62 0006 2000 5000 0006 8107 73 (Resul Sakal)</b><br><br>
                ⚠️ Ödemeyi yaptıktan sonra bilgileri girip bildirim gönderin.
            `;
            document.getElementById('customerTarget').value = '';
            document.getElementById('customerContact').value = '';
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('orderModal').style.display = 'none'; location.reload(); }

        async function submitPayment() {
            const target = document.getElementById('customerTarget').value.trim();
            const contact = document.getElementById('customerContact').value.trim();
            if(!target || !contact) { alert('Lütfen tüm alanları doldurun!'); return; }

            const payBtn = document.getElementById('payButton');
            payBtn.innerText = "Gönderiliyor...";
            payBtn.disabled = true;

            const res = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product: selectedProductData, target, customerContact: contact })
            });
            const data = await res.json();
            
            document.getElementById('formSection').style.display = 'none';
            const resultSec = document.getElementById('resultSection');
            resultSec.style.display = 'block';

            if(data.success) {
                resultSec.innerHTML = `<div class="result-box">✅ Ödeme bildiriminiz adminé iletildi! Yönetici onayladığı an işlem otomatik olarak başlatılacaktır.</div>`;
            } else {
                resultSec.innerHTML = `<div class="result-box" style="border-color:#ef4444; color:#ef4444;">⚠️ Hata oluştu: ${data.message}</div>`;
            }
        }
    </script>
</body>
</html>
